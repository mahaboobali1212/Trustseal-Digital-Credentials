# ====================================================================
# TrustSeal GitLab CI/CD Pipeline Configuration
# Core Pillar 02: GitLab CI/CD & GCP Automated Deployments
# ====================================================================

image: node:22-alpine

stages:
  - lint
  - test
  - build-container
  - deploy-gcp

variables:
  DOCKER_IMAGE: "gcr.io/$GCP_PROJECT_ID/trustseal-gateway:$CI_COMMIT_SHORT_SHA"
  NEXT_TELEMETRY_DISABLED: "1"

# Stage 1: Static Code Analysis & Strict TypeScript Linting
lint-and-typecheck:
  stage: lint
  before_script:
    - npm ci
  script:
    - npm run lint
    - npx tsc --noEmit
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH == "main"'

# Stage 2: Automated Unit & Transaction Tests
unit-tests:
  stage: test
  before_script:
    - npm ci
  script:
    - echo "Running outbox transaction and cryptographic seal verification tests..."
    - npm test --if-present
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH == "main"'

# Stage 3: Docker Multi-Stage Image Build
build-docker:
  stage: build-container
  image: docker:24-dind
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - echo "$GCP_SERVICE_KEY" | docker login -u _json_key --password-stdin https://gcr.io
  script:
    - docker build -t $DOCKER_IMAGE .
    - docker push $DOCKER_IMAGE
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# Stage 4: Automated Deployment to Google Cloud Run (GCP)
deploy-to-gcp:
  stage: deploy-gcp
  image: google/cloud-sdk:alpine
  before_script:
    - echo "$GCP_SERVICE_KEY" > /tmp/gcp-key.json
    - gcloud auth activate-service-account --key-file=/tmp/gcp-key.json
    - gcloud config set project $GCP_PROJECT_ID
  script:
    - >
      gcloud run deploy trustseal-gateway
      --image $DOCKER_IMAGE
      --platform managed
      --region us-central1
      --allow-unauthenticated
      --set-env-vars DATABASE_URL="$PROD_DATABASE_URL",REDIS_URL="$PROD_REDIS_URL"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
