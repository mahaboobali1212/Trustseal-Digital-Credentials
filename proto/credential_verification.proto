syntax = "proto3";

package trustseal.crypto;

// TrustSeal Cryptographic & Tamper-Proof Verification Service
// Core Pillar 04: gRPC over mTLS & Protocol Buffers
service CredentialVerificationService {
  // Verifies the integrity of a credential against its SHA-256 seal and signature
  rpc VerifyCredential (VerifyRequest) returns (VerifyResponse);

  // Generates a tamper-proof cryptographic SHA-256 seal and digital signature
  rpc GenerateSeal (SealRequest) returns (SealResponse);
}

message VerifyRequest {
  string credential_id = 1;
  string recipient_name = 2;
  string course_or_role = 3;
  string issuing_org = 4;
  string sha256_hash = 5;
  string digital_signature = 6;
}

message VerifyResponse {
  bool is_valid = 1;
  bool tampered = 2;
  string computed_hash = 3;
  string verification_timestamp = 4;
  string message = 5;
}

message SealRequest {
  string credential_id = 1;
  string recipient_name = 2;
  string recipient_email = 3;
  string course_or_role = 4;
  string issuing_org = 5;
  string issue_date = 6;
}

message SealResponse {
  string sha256_hash = 1;
  string digital_signature = 2;
  string algorithm = 3;
  string created_at = 4;
}
